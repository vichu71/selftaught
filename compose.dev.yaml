# Añadidos del perfil dev: puertos de depuración (solo 127.0.0.1) y Mailpit para ver los correos.
# Se usa siempre junto a compose.yaml: docker compose -f compose.yaml -f compose.dev.yaml --profile dev ...
services:
  backend:
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      mailpit:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # F02: sin claves ni gasto por defecto; para probar un modelo real, defínelo en .env
      APP_AI_TASKS_OUTLINE_PROVIDER: ${APP_AI_TASKS_OUTLINE_PROVIDER:-fake}
      APP_AI_TASKS_OUTLINE_MODEL: ${APP_AI_TASKS_OUTLINE_MODEL:-fake-1}
      APP_AI_TASKS_LESSON_PROVIDER: ${APP_AI_TASKS_LESSON_PROVIDER:-fake}
      APP_AI_TASKS_LESSON_MODEL: ${APP_AI_TASKS_LESSON_MODEL:-fake-1}
      APP_AI_TASKS_ASSESSMENT_PROVIDER: ${APP_AI_TASKS_ASSESSMENT_PROVIDER:-fake}
      APP_AI_TASKS_ASSESSMENT_MODEL: ${APP_AI_TASKS_ASSESSMENT_MODEL:-fake-1}
      APP_AI_TASKS_TUTOR_PROVIDER: ${APP_AI_TASKS_TUTOR_PROVIDER:-fake}
      APP_AI_TASKS_TUTOR_MODEL: ${APP_AI_TASKS_TUTOR_MODEL:-fake-1}
      APP_AI_TASKS_EMBEDDING_PROVIDER: ${APP_AI_TASKS_EMBEDDING_PROVIDER:-fake}
      APP_AI_TASKS_EMBEDDING_MODEL: ${APP_AI_TASKS_EMBEDDING_MODEL:-fake-embed}
      APP_AI_TASKS_INTAKE_PROVIDER: ${APP_AI_TASKS_INTAKE_PROVIDER:-fake}
      APP_AI_TASKS_INTAKE_MODEL: ${APP_AI_TASKS_INTAKE_MODEL:-fake-1}
      # Mailpit no valida credenciales: valores públicos de desarrollo, no son secretos
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
      SPRING_MAIL_USERNAME: mailpit
      SPRING_MAIL_PASSWORD: mailpit

  db:
    ports:
      - "127.0.0.1:5432:5432"

  mailpit:
    image: axllent/mailpit:v1.27.8
    profiles: ["dev"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
