# Precios por modelo, en USD por millón de tokens. Un modelo sin precio aquí impide arrancar (nunca se asume coste 0).
#
# Formato:   app.ai.pricing[proveedor/modelo].input-per-million=...
#            app.ai.pricing[proveedor/modelo].output-per-million=...
#
# Cada bloque lleva la fecha en que se comprobó el precio en la página oficial del proveedor. El coste que calcula la app es una
# ESTIMACIÓN: el benchmark la contrasta con el panel de cada proveedor. Los modelos "con pensamiento" facturan el razonamiento como
# salida, y los proveedores lo incluyen en los tokens de salida que devuelven.
#
# Se añaden al elegir modelos con el benchmark (ver sdd/specs/US-F02-capa-ia-control-gasto.md).

# Anthropic: verificado en la página oficial el 25-10-2026.
app.ai.pricing[anthropic/claude-haiku-5-5].input-per-million=0.10
app.ai.pricing[anthropic/claude-haiku-5-5].output-per-million=0.50

# Gemini: verificado en la página oficial el 25-10-2026. OJO: sube de precio el 1-1-2027; revisar antes.
app.ai.pricing[gemini/gemini-3.6-flash].input-per-million=0.75
app.ai.pricing[gemini/gemini-3.6-flash].output-per-million=3.75

# OpenAI: SIN CONFIRMAR (su página oficial no estuvo accesible; datos de una búsqueda el 25-10-2026). Contrastar con el panel de OpenAI.
app.ai.pricing[openai/gpt-6.1-sol].input-per-million=2.00
app.ai.pricing[openai/gpt-6.1-sol].output-per-million=10.00

# Ollama (local) cuesta 0 pero también debe declararse:
app.ai.pricing[ollama/nomic-embed-text].input-per-million=0
app.ai.pricing[ollama/nomic-embed-text].output-per-million=0
