# Precios por modelo, en USD por millón de tokens. Un modelo sin precio aquí impide arrancar (nunca se asume coste 0).
#
# Formato:   app.ai.pricing[proveedor/modelo].input-per-million=...
#            app.ai.pricing[proveedor/modelo].output-per-million=...
#
# Cada bloque lleva la fecha en que se comprobó el precio en la página oficial del proveedor, también como dato (`verified-on=AAAA-MM-DD`, opcional)
# para que el panel del propietario (F14) la enseñe y avise de los precios con más de 90 días o sin fecha. El coste que calcula la app es una
# ESTIMACIÓN: el benchmark la contrasta con el panel de cada proveedor. Los modelos "con pensamiento" facturan el razonamiento como
# salida, y los proveedores lo incluyen en los tokens de salida que devuelven.
#
# Se añaden al elegir modelos con el benchmark (ver sdd/specs/US-F02-capa-ia-control-gasto.md).

# Anthropic: verificado en la página oficial el 25-10-2026.
app.ai.pricing[anthropic/claude-haiku-5-5].input-per-million=0.10
app.ai.pricing[anthropic/claude-haiku-5-5].output-per-million=0.50
app.ai.pricing[anthropic/claude-haiku-5-5].verified-on=2026-10-25

# Gemini: verificado en la página oficial el 25-10-2026. OJO: sube de precio el 1-1-2027; revisar antes.
app.ai.pricing[gemini/gemini-3.6-flash].input-per-million=0.75
app.ai.pricing[gemini/gemini-3.6-flash].output-per-million=3.75
app.ai.pricing[gemini/gemini-3.6-flash].verified-on=2026-10-25

# OpenAI: SIN CONFIRMAR (su página oficial no estuvo accesible; datos de una búsqueda el 25-10-2026). Contrastar con el panel de OpenAI.
app.ai.pricing[openai/gpt-6.1-sol].input-per-million=2.00
app.ai.pricing[openai/gpt-6.1-sol].output-per-million=10.00
# Sin `verified-on` a propósito: el precio no está confirmado y el panel del propietario lo marca como «sin fecha».

# Ollama (local) cuesta 0 pero también debe declararse:
app.ai.pricing[ollama/nomic-embed-text].input-per-million=0
app.ai.pricing[ollama/nomic-embed-text].output-per-million=0

# ---------- Imágenes (F12) ----------
# Una imagen se factura por imagen, no por token: app.ai.image-pricing[proveedor/modelo].per-image=USD. Un modelo de imagen sin precio aquí no arranca
# (nunca se asume coste 0). NO HAY NINGÚN MODELO DE IMAGEN CON PRECIO TODAVÍA: se elige con `make benchmark-images` (ADR-83), y al elegirlo se añade aquí su
# precio por imagen con la fecha en que se verificó en la página oficial del proveedor. Plantilla (copiar y quitar el comentario):
#
# OpenAI/Gemini: verificado en la página oficial el AAAA-MM-DD.
# app.ai.image-pricing[proveedor/modelo].per-image=0.00
#
# OpenAI gpt-image-1-mini: 1024x1024, calidad baja (la de app.ai.image-quality por defecto). Verificado en developers.openai.com el 2026-10-27 (media 0.011, alta 0.036).
# Un foro de la comunidad de OpenAI sostiene que la facturación real puede diferir de la tabla: contrastar con el primer gasto real.
app.ai.image-pricing[openai/gpt-image-1-mini].per-image=0.005
app.ai.image-pricing[openai/gpt-image-1-mini].verified-on=2026-10-27
