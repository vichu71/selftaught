spring.application.name=studylab
spring.main.banner-mode=off

# Variables de entorno: APP_PUBLIC_URL llega sola por relaxed binding; las demás se nombran aquí.
app.mail.enabled=${MAIL_ENABLED:true}
app.mail.from=${MAIL_FROM:}
app.session-ttl=PT168H

# F14: correo del propietario (el único que ve el panel /api/owner). Opcional y SIN valor por defecto: vacío = no hay propietario ni panel (ADR-87)
app.owner.email=${OWNER_EMAIL:}

# Detrás de nginx: la IP real llega en X-Forwarded-For (nginx la sobrescribe)
server.forward-headers-strategy=native
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

spring.flyway.locations=classpath:db/migration

# Solo /actuator/health, sin detalles ni dependencia de que el SMTP responda
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

logging.level.org.springframework.security=WARN

# ---------- F02: capa de IA ----------
# Qué proveedor y modelo usa cada tarea llega por entorno (APP_AI_TASKS_OUTLINE_PROVIDER, _MODEL…): sin valor, no arranca.
# Los límites de salida y los tiempos son configuración, no código.
app.ai.tasks.outline.max-output-tokens=4000
app.ai.tasks.outline.timeout=120s
app.ai.tasks.lesson.max-output-tokens=6000
app.ai.tasks.lesson.timeout=180s
app.ai.tasks.assessment.max-output-tokens=10000
app.ai.tasks.assessment.timeout=180s
app.ai.tasks.tutor.max-output-tokens=1500
app.ai.tasks.tutor.timeout=60s
app.ai.tasks.embedding.timeout=60s
# F04: asistente de creación de curso. Basta un modelo rápido y barato; responde un JSON corto.
app.ai.tasks.intake.max-output-tokens=1500
app.ai.tasks.intake.timeout=60s

app.ai.providers.anthropic.api-key=${ANTHROPIC_API_KEY:}
app.ai.providers.anthropic.base-url=https://api.anthropic.com
app.ai.providers.openai.api-key=${OPENAI_API_KEY:}
app.ai.providers.openai.base-url=https://api.openai.com
app.ai.providers.gemini.api-key=${GEMINI_API_KEY:}
app.ai.providers.gemini.base-url=https://generativelanguage.googleapis.com
app.ai.providers.ollama.base-url=${OLLAMA_BASE_URL:http://ollama:11434}

# Tope mensual: obligatorio con un proveedor real. WARN avisa y sigue (decisión del usuario); BLOCK además rechaza llamadas.
app.ai.budget.monthly-limit-usd=${AI_MONTHLY_LIMIT_USD:}
app.ai.budget.mode=${AI_BUDGET_MODE:WARN}
app.ai.budget.warn-at-percent=80
# Tope personal por usuario y mes (A1), en USD: corta siempre, también en WARN. Un menor tiene el suyo, más bajo.
app.ai.budget.user-limit-minor-usd=${AI_USER_LIMIT_MINOR_USD:2.00}
app.ai.budget.user-limit-adult-usd=${AI_USER_LIMIT_ADULT_USD:10.00}

app.ai.hard-max-output-tokens=16000
app.ai.max-input-chars=60000
app.ai.retry.max-retries=2
app.ai.retry.backoff=1s
app.ai.generation-lock-ttl=20m
app.ai.embedding.dimensions=768

# Precios por modelo (USD por millón de tokens), con su fecha de verificación
spring.config.import=classpath:ai-pricing.properties

# ---------- F03: material propio ----------
# Límites por entorno (MATERIAL_MAX_FILE_MB, MATERIAL_MAX_DOCUMENTS); el resto de parámetros tiene su valor en MaterialProperties.
# Si cambias el tamaño máximo, sube también client_max_body_size de /api/material en frontend/nginx.conf (hoy 11m).
app.material.max-file-mb=${MATERIAL_MAX_FILE_MB:10}
app.material.max-documents=${MATERIAL_MAX_DOCUMENTS:20}
# Spring MVC escribe el cuerpo de cada respuesta en el log a nivel DEBUG: con material, eso incluiría nombres de documentos del usuario.
# Se fija en INFO para que ningún nivel que active un operador los deje salir (lo comprueba MaterialArchitectureTest).
logging.level.org.springframework.web.servlet.mvc.method.annotation=INFO

# ---------- F04: asistente de creación de curso ----------
# Límites por usuario (A2, ADR-41): consultas por hora y cursos pendientes de generar. La caducidad de una consulta (1 h) es un valor de ingeniería.
app.course.intakes-per-hour=${COURSE_INTAKES_PER_HOUR:30}
app.course.max-pending=${COURSE_MAX_PENDING:5}

# ---------- F05: generación del curso ----------
# Valores de ingeniería sin variable de entorno (GenerationProperties): hilos de fondo (2, sondeo cada 3 s), máximo de piezas por curso (150)
# y enfriamiento de «Reanudar» (60 s). Para cambiarlos: app.generation.worker.threads, app.generation.max-pieces, app.generation.resume-cooldown.

# ---------- F06: estudio ----------
# Valores de ingeniería sin variable de entorno (StudyProperties): nota mínima del examen (50 %), envíos por hora y usuario (120), correcciones de IA al día (20)
# e intentos que se conservan por pieza (200). Para cambiarlos: app.study.pass-percent, app.study.max-submissions-per-hour, app.study.ai-grades-per-day, app.study.max-attempts-per-piece.

# ---------- F07: tutor IA por lección ----------
# Valores de ingeniería sin variable de entorno (TutorProperties): preguntas por hora (30) y por día (150) y usuario, mensajes que se conservan por lección (400, no menos de
# 2 × las del día), intercambios y caracteres de historial que se envían al modelo (6 y 6000) y ventana en que una respuesta pendiente bloquea otra (2 m).
# Para cambiarlos: app.tutor.max-per-hour, app.tutor.max-per-day, app.tutor.max-stored, app.tutor.history-exchanges, app.tutor.history-chars, app.tutor.busy-window.

# ---------- F09: edición de temario y compartir por código ----------
# Valores de ingeniería sin variable de entorno (CourseEditProperties y ShareProperties): ediciones con IA por hora y usuario (20), caducidad por defecto y máxima de un código (7 y 90 días),
# códigos activos por curso (5) y, por usuario y hora, canjes fallidos (10) y copias (10). Para cambiarlos: app.course-edit.ai-actions-per-hour, app.share.default-days, app.share.max-days,
# app.share.max-active, app.share.max-failures-per-hour, app.share.max-copies-per-hour.

# ---------- F19: fotos de apuntes ----------
# La tarea OCR (lectura de una foto) es opcional: sin APP_AI_TASKS_OCR_PROVIDER / _MODEL las fotos quedan desactivadas y la aplicación arranca igual.
# Con modelo, exige su precio por tokens en ai-pricing.properties y la clave de su proveedor. Solo sirven los proveedores que ven imágenes (openai, gemini).
app.ai.tasks.ocr.max-output-tokens=2000
app.ai.tasks.ocr.timeout=90s
# Una foto pesa como máximo MATERIAL_MAX_IMAGE_MB (no más que MATERIAL_MAX_FILE_MB; si subes este, sube también client_max_body_size de nginx).
app.material.photos.max-mb=${MATERIAL_MAX_IMAGE_MB:5}
app.material.photos.max-pixels=25000000
app.material.photos.max-side=1568
app.material.photos.max-reads-per-day=${MATERIAL_MAX_IMAGE_READS_PER_DAY:20}
