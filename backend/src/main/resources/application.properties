spring.application.name=studylab
spring.main.banner-mode=off

# Variables de entorno: APP_PUBLIC_URL llega sola por relaxed binding; las demás se nombran aquí.
app.mail.enabled=${MAIL_ENABLED:true}
app.mail.from=${MAIL_FROM:}
app.session-ttl=PT168H

# Detrás de nginx: la IP real llega en X-Forwarded-For (nginx la sobrescribe)
server.forward-headers-strategy=native
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

spring.flyway.locations=classpath:db/migration

# Solo /actuator/health, sin detalles ni dependencia de que el SMTP responda
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

logging.level.org.springframework.security=WARN
