# Perfil "test": la BD es la del servicio db-test de Compose. Todo llega por variables de entorno.
# La app se conecta con un rol de mínimos privilegios; Flyway migra con el rol propietario.
spring.datasource.url=${TEST_DB_URL}
spring.datasource.username=${TEST_DB_APP_USER}
spring.datasource.password=${TEST_DB_APP_PASSWORD}
spring.flyway.user=${TEST_DB_OWNER_USER}
spring.flyway.password=${TEST_DB_OWNER_PASSWORD}

# Valores falsos: el servidor SMTP real es GreenMail en memoria (ver IntegrationTestBase)
app.public-url=http://localhost
app.mail.enabled=true
app.mail.from=noreply@test.local
spring.mail.username=test
spring.mail.password=test

# ---------- F02: capa de IA (todo con el proveedor falso; ninguna llamada de red) ----------
app.ai.tasks.outline.provider=fake
app.ai.tasks.outline.model=fake-1
app.ai.tasks.outline.max-output-tokens=200
app.ai.tasks.outline.timeout=5s
app.ai.tasks.lesson.provider=fake
app.ai.tasks.lesson.model=fake-1
app.ai.tasks.lesson.max-output-tokens=300
app.ai.tasks.lesson.timeout=5s
app.ai.tasks.assessment.provider=fake
app.ai.tasks.assessment.model=fake-1
app.ai.tasks.assessment.max-output-tokens=300
app.ai.tasks.assessment.timeout=5s
app.ai.tasks.tutor.provider=fake
app.ai.tasks.tutor.model=fake-1
app.ai.tasks.tutor.max-output-tokens=150
app.ai.tasks.tutor.timeout=5s
app.ai.tasks.embedding.provider=fake
app.ai.tasks.embedding.model=fake-embed
app.ai.tasks.embedding.timeout=5s
app.ai.tasks.intake.provider=fake
app.ai.tasks.intake.model=fake-1
app.ai.tasks.intake.max-output-tokens=1500
app.ai.tasks.intake.timeout=5s

# Precios ficticios fáciles de calcular a mano (USD por millón de tokens)
app.ai.pricing[fake/fake-1].input-per-million=1.0
app.ai.pricing[fake/fake-1].output-per-million=2.0
app.ai.pricing[fake/fake-2].input-per-million=3.0
app.ai.pricing[fake/fake-2].output-per-million=6.0
app.ai.pricing[fake/fake-embed].input-per-million=0
app.ai.pricing[fake/fake-embed].output-per-million=0

app.ai.budget.monthly-limit-usd=10.00
app.ai.budget.warn-at-percent=80
app.ai.budget.mode=WARN
app.ai.budget.user-limit-minor-usd=1.00
app.ai.budget.user-limit-adult-usd=5.00
app.ai.hard-max-output-tokens=4000
app.ai.max-input-chars=20000
app.ai.retry.max-retries=2
app.ai.retry.backoff=1ms
app.ai.generation-lock-ttl=20m
app.ai.embedding.dimensions=8
app.ai.benchmark.autorun=false

# ---------- F03: material propio ----------
# El hilo de fondo está apagado: los tests procesan de forma síncrona con MaterialWorker.processPending()
app.material.worker.enabled=false

# ---------- F04: asistente de creación de curso ----------
# Los límites por defecto (30 consultas por hora y 5 cursos pendientes) valen; CourseLimitsTest los baja en su propio contexto
