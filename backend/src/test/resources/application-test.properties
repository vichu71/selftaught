# Perfil "test": la BD es la del servicio db-test de Compose. Todo llega por variables de entorno.
# La app se conecta con un rol de mínimos privilegios; Flyway migra con el rol propietario.
spring.datasource.url=${TEST_DB_URL}
spring.datasource.username=${TEST_DB_APP_USER}
spring.datasource.password=${TEST_DB_APP_PASSWORD}
spring.flyway.user=${TEST_DB_OWNER_USER}
spring.flyway.password=${TEST_DB_OWNER_PASSWORD}

# Valores falsos: el servidor SMTP real es GreenMail en memoria (ver IntegrationTestBase)
app.public-url=http://localhost
app.mail.enabled=true
app.mail.from=noreply@test.local
spring.mail.username=test
spring.mail.password=test
